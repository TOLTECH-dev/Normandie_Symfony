parameters:
    # reCAPTCHA actif en dev : les cles de .env.dev.local sont les cles de test
    # publiques de Google, valides sur n'importe quel domaine.
    captcha_enabled: true

services:
    App\EventListener\ExceptionListener:
        autowire: true
        autoconfigure: false

    App\Listener\CspNonceInjectorListener:
        autowire: true
        autoconfigure: false
