# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    locale: 'fr'
    google_recaptcha_site_key: '%env(GOOGLE_RECAPTCHA_SITE_KEY)%'
    captcha_enabled: true

    app_root_dossier_data_symfony: '%env(APP_ROOT_DOSSIER_DATA_SYMFONY)%'
    app_as400_folder_in: '%env(APP_AS400_FOLDER_IN)%'
    app_as400_folder_out: '%env(APP_AS400_FOLDER_OUT)%'

    date_reference: '%env(DATE_REFERENCE)%'
    date_reference_convert: '%env(DATE_REFERENCE_CONVERT)%'

    logout_redirection_fo: '%env(LOGOUT_REDIRECTION_FO)%'
    logout_redirection_bo: '%env(LOGOUT_REDIRECTION_BO)%'
    url_fo: '%env(URL_FO)%'
    url_bo: '%env(URL_BO)%'

    production_auditEnergie: '%env(PRODUCTION_AUDIT_ENERGIE)%'
    production_auditNumerique: '%env(PRODUCTION_AUDIT_NUMERIQUE)%'
    production_travauxNiveau1_2: '%env(PRODUCTION_TRAVAUX_NIVEAU_1_2)%'
    production_travauxNiveau_BBC1: '%env(PRODUCTION_TRAVAUX_NIVEAU_BBC1)%'
    production_travauxNiveau_BBC2: '%env(PRODUCTION_TRAVAUX_NIVEAU_BBC2)%'

    production_operation:
        - '%production_auditEnergie%'
        - '%production_auditNumerique%'
        - '%production_travauxNiveau1_2%'
        - '%production_travauxNiveau_BBC1%'
        - '%production_travauxNiveau_BBC2%'

    production_demat_value: '%env(PRODUCTION_DEMAT_VALUE)%'
    production_top_reedition_value: '%env(PRODUCTION_TOP_REEDITION_VALUE)%'

    rmh_file_numero_departement: '%env(RMH_FILE_NUMERO_DEPARTEMENT)%'
    rmh_file_code_collectivite: '%env(RMH_FILE_CODE_COLLECTIVITE)%'
    rmh_file_numero_train_virement: '%env(RMH_FILE_NUMERO_TRAIN_VIREMENT)%'
    rmh_file_code_nature: '%env(RMH_FILE_CODE_NATURE)%'
    rmh_file_code_monnaie: '%env(RMH_FILE_CODE_MONNAIE)%'
    rmh_file_libelle_operation: '%env(RMH_FILE_LIBELLE_OPERATION)%'
    rmh_file_prefix: '%env(RMH_FILE_PREFIX)%'

    rating_from_conseiller_to_auditeur: '%env(RATING_FROM_CONSEILLER_TO_AUDITEUR)%'
    rating_from_region_to_renovateur: '%env(RATING_FROM_REGION_TO_RENOVATEUR)%'

    email_region_paiement: '%env(EMAIL_REGION_PAIEMENT)%'
    email_region_instruction: '%env(EMAIL_REGION_INSTRUCTION)%'
    email_prestataire_instruction: '%env(EMAIL_PRESTATAIRE_INSTRUCTION)%'

    app_date_passage_montant_travaux_niveau_3_BBC: '%env(APP_DATE_PASSAGE_MONTANT_TRAVAUX_NIVEAU_3_BBC)%'
    app_date_debut_SARE: '%env(APP_DATE_DEBUT_SARE)%'
    app_date_us_passage_montant_auditEnergie: '%env(APP_DATE_US_PASSAGE_MONTANT_AUDIT_ENERGIE)%'
    app_date_passage_montant_auditRegion: '%env(APP_DATE_PASSAGE_MONTANT_AUDIT_REGION)%'
    app_date_us_nouvel_instructeur: '%env(APP_DATE_US_NOUVEL_INSTRUCTEUR)%'
    app_date_limite_creation_demande_member: '%env(APP_DATE_LIMITE_CREATION_DEMANDE_MEMBER)%'
    app_date_limite_creation_demande_conseiller: '%env(APP_DATE_LIMITE_CREATION_DEMANDE_CONSEILLER)%'

    app_export_ADEME_A03_structure: '%env(APP_EXPORT_ADEME_A03_STRUCTURE)%'
    app_export_ADEME_A03_type_acte: '%env(APP_EXPORT_ADEME_A03_TYPE_ACTE)%'
    app_export_ADEME_A03_type_logement: '%env(APP_EXPORT_ADEME_A03_TYPE_LOGEMENT)%'
    app_export_ADEME_A03_rapport_audit_DTG_remis: '%env(APP_EXPORT_ADEME_A03_RAPPORT_AUDIT_DTG_REMIS)%'

    app_export_ADEME_A05_structure: '%env(APP_EXPORT_ADEME_A05_STRUCTURE)%'
    app_export_ADEME_A05_type_acte: '%env(APP_EXPORT_ADEME_A05_TYPE_ACTE)%'
    app_export_ADEME_A05_type_logement: '%env(APP_EXPORT_ADEME_A05_TYPE_LOGEMENT)%'
    app_export_ADEME_A05_rapport_audit_DTG_remis: '%env(APP_EXPORT_ADEME_A05_RAPPORT_AUDIT_DTG_REMIS)%'

    is_production: '%env(IS_PRODUCTION)%'
    app_is_https: '%env(APP_IS_HTTPS)%'

    security_time_expire_user_ip: '%env(SECURITY_TIME_EXPIRE_USER_IP)%'
    security_time_expire_user_show_recaptcha: '%env(SECURITY_TIME_EXPIRE_USER_SHOW_RECAPTCHA)%'
    security_max_login_failure_attempts: '%env(SECURITY_MAX_LOGIN_FAILURE_ATTEMPTS)%'

    security_login_ip_max_attempts: '%env(int:SECURITY_LOGIN_IP_MAX_ATTEMPTS)%'
    security_login_ip_interval: '%env(SECURITY_LOGIN_IP_INTERVAL)%'
    security_login_username_ip_max_attempts: '%env(int:SECURITY_LOGIN_USERNAME_IP_MAX_ATTEMPTS)%'
    security_login_username_ip_interval: '%env(SECURITY_LOGIN_USERNAME_IP_INTERVAL)%'
    security_login_username_max_attempts: '%env(int:SECURITY_LOGIN_USERNAME_MAX_ATTEMPTS)%'
    security_login_username_interval: '%env(SECURITY_LOGIN_USERNAME_INTERVAL)%'

    security_resetting_request_ip_max_attempts: '%env(int:SECURITY_RESETTING_REQUEST_IP_MAX_ATTEMPTS)%'
    security_resetting_request_ip_interval: '%env(SECURITY_RESETTING_REQUEST_IP_INTERVAL)%'
    security_resetting_request_username_max_attempts: '%env(int:SECURITY_RESETTING_REQUEST_USERNAME_MAX_ATTEMPTS)%'
    security_resetting_request_username_interval: '%env(SECURITY_RESETTING_REQUEST_USERNAME_INTERVAL)%'
    security_resetting_reset_ip_max_attempts: '%env(int:SECURITY_RESETTING_RESET_IP_MAX_ATTEMPTS)%'
    security_resetting_reset_ip_interval: '%env(SECURITY_RESETTING_RESET_IP_INTERVAL)%'
    security_registration_ip_max_attempts: '%env(int:SECURITY_REGISTRATION_IP_MAX_ATTEMPTS)%'
    security_registration_ip_interval: '%env(SECURITY_REGISTRATION_IP_INTERVAL)%'

    # Authentification multi-facteur (MFA) préconisée par l'audit ALMOND pour les profils
    # Administrateur, Instructeur et Client (cf. App\Security\TwoFactor\MfaPolicy).
    security_mfa_roles: [ ROLE_SUPER_ADMIN, ROLE_ADMIN, ROLE_INSTRUCTEUR, ROLE_INSTRUCTEUR_UP, ROLE_CLIENT ]
    security_mfa_code_lifetime_minutes: '%env(int:SECURITY_MFA_CODE_LIFETIME_MINUTES)%'
    security_mfa_code_max_attempts: '%env(int:SECURITY_MFA_CODE_MAX_ATTEMPTS)%'
    security_mfa_username_max_attempts: '%env(int:SECURITY_MFA_USERNAME_MAX_ATTEMPTS)%'
    security_mfa_username_interval: '%env(SECURITY_MFA_USERNAME_INTERVAL)%'

    # Expiration périodique des mots de passe (Reco-15, cf. App\Security\Password\PasswordExpirationPolicy).
    # Comptes à privilèges uniquement : le guide ANSSI PG-078 recommande l'expiration pour ces comptes
    # (R25) et la déconseille par défaut pour les comptes peu sensibles (R24).
    security_password_expiration_roles: [ ROLE_SUPER_ADMIN, ROLE_ADMIN, ROLE_INSTRUCTEUR, ROLE_INSTRUCTEUR_UP, ROLE_CLIENT ]
    security_password_expiration_months: '%env(int:SECURITY_PASSWORD_EXPIRATION_MONTHS)%'
    security_password_expiration_warning_days: '%env(int:SECURITY_PASSWORD_EXPIRATION_WARNING_DAYS)%'
    security_password_history_size: '%env(int:SECURITY_PASSWORD_HISTORY_SIZE)%'

    # Filtrage par réseau des interfaces d'administration (Reco-18, cf. App\Security\Ip\IpFilterPolicy).
    # Un groupe = un organisme. Les réseaux sont donnés par environnement (.env.<env>.local), au
    # format IP ou CIDR séparés par des virgules ; liste vide = groupe non filtré.
    security_ip_filter_roles:
        administrateurs: [ ROLE_SUPER_ADMIN, ROLE_ADMIN ]
        region:          [ ROLE_CLIENT ]
        docaposte:       [ ROLE_INSTRUCTEUR, ROLE_INSTRUCTEUR_UP ]

    # Analyse antivirale des fichiers déposés (vulnérabilité 5 / recommandation 9 de l'audit ALMOND,
    # cf. App\Security\Antivirus\ClamavScanner). L'analyse a lieu au dépôt, avant enregistrement.
    security_antivirus_enabled: '%env(bool:SECURITY_ANTIVIRUS_ENABLED)%'
    security_antivirus_dsn: '%env(SECURITY_ANTIVIRUS_DSN)%'
    security_antivirus_timeout: '%env(int:SECURITY_ANTIVIRUS_TIMEOUT)%'
    security_antivirus_max_stream_size: '%env(int:SECURITY_ANTIVIRUS_MAX_STREAM_SIZE)%'
    # Analyse impossible (service arrêté ou injoignable) : refuser le dépôt plutôt que d'accepter
    # un fichier non analysé, ce qui désactiverait la mesure sans que personne ne s'en aperçoive.
    security_antivirus_refuse_when_unavailable: '%env(bool:SECURITY_ANTIVIRUS_REFUSE_WHEN_UNAVAILABLE)%'
    security_antivirus_alert_enabled: '%env(bool:SECURITY_ANTIVIRUS_ALERT_ENABLED)%'
    security_antivirus_alert_roles: [ ROLE_SUPER_ADMIN, ROLE_ADMIN ]
    security_ip_filter_networks:
        administrateurs: '%env(csv:SECURITY_IP_FILTER_ADMINISTRATEURS)%'
        region:          '%env(csv:SECURITY_IP_FILTER_REGION)%'
        docaposte:       '%env(csv:SECURITY_IP_FILTER_DOCAPOSTE)%'

    fc_js_url: '%env(FC_JS_URL)%'

    mailer_address_from: '%env(MAILER_ADDRESS_FROM)%'

    resetting_retry_ttl: '%env(RESETTING_RETRY_TTL)%'
    app_logo_path: '%kernel.project_dir%/public/build/images/frontOffice/logo/'

    app_api_clea_base_url: '%env(APP_API_CLEA_BASE_URL)%'
    app_api_clea_client_id: '%env(APP_API_CLEA_CLIENT_ID)%'
    app_api_clea_client_secret: '%env(APP_API_CLEA_CLIENT_SECRET)%'
    app_api_clea_user_id: '%env(APP_API_CLEA_USER_ID)%'
    app_api_clea_is_data_production: '%env(APP_API_CLEA_IS_DATA_PRODUCTION)%'

    session_max_idle_time: '%env(SESSION_MAX_IDLE_TIME)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: [ 'controller.service_arguments' ]

    # --- Filtrage par réseau des interfaces d'administration (Reco-18) ---
    App\Security\Ip\IpFilterPolicy:
        arguments:
            $reseauxParGroupe: '%security_ip_filter_networks%'
            $rolesParGroupe: '%security_ip_filter_roles%'

    # --- Analyse antivirale des fichiers déposés (vulnérabilité 5 / recommandation 9) ---
    # Le service résident ClamAV n'existe pas sur les postes de développement : l'analyse y est
    # neutralisée, et chaque dépôt non analysé laisse une trace dans les journaux.
    App\Security\Antivirus\ScannerFactory:
        arguments:
            $analyseActive: '%security_antivirus_enabled%'
            $dsn: '%security_antivirus_dsn%'
            $delaiMax: '%security_antivirus_timeout%'
            $tailleMaxFlux: '%security_antivirus_max_stream_size%'

    App\Security\Antivirus\AntivirusScanner:
        factory: [ '@App\Security\Antivirus\ScannerFactory', 'creer' ]

    App\Security\Antivirus\AlerteAntivirusMailer:
        arguments:
            $rolesAlertes: '%security_antivirus_alert_roles%'
            $alerteActive: '%security_antivirus_alert_enabled%'

    App\Security\Antivirus\AlerteAntivirus: '@App\Security\Antivirus\AlerteAntivirusMailer'

    App\Validator\FichierSansVirusValidator:
        arguments:
            $refuserSiIndisponible: '%security_antivirus_refuse_when_unavailable%'
        tags: [ 'validator.constraint_validator' ]

    # --- Authentification multi-facteur (MFA) : cf. config/packages/scheb_2fa.yaml ---
    App\Security\TwoFactor\MfaPolicy:
        arguments:
            $mfaRoles: '%security_mfa_roles%'

    App\Security\TwoFactor\EmailCodeProvider:
        arguments:
            $formRenderer: '@app.security.two_factor.email_code_form_renderer'
            $secret: '%kernel.secret%'
            $codeLifetimeMinutes: '%security_mfa_code_lifetime_minutes%'
            $maxAttemptsPerCode: '%security_mfa_code_max_attempts%'
        tags:
            - { name: scheb_two_factor.provider, alias: email_code }

    app.security.two_factor.email_code_form_renderer:
        class: Scheb\TwoFactorBundle\Security\TwoFactor\Provider\DefaultTwoFactorFormRenderer
        arguments:
            $template: 'BackOffice/Security/2fa.html.twig'
            $templateVars:
                codeLifetimeMinutes: '%security_mfa_code_lifetime_minutes%'

    # Abonné au seul firewall "main" : sur "backoffice", ces profils passent par le MFA.
    App\Security\Subscriber\MainFirewallMfaGuardSubscriber:
        autoconfigure: false
        tags:
            - { name: kernel.event_subscriber, dispatcher: security.event_dispatcher.main }

    # --- Expiration périodique des mots de passe (Reco-15) ---
    App\Security\Password\PasswordExpirationPolicy:
        arguments:
            $expirationRoles: '%security_password_expiration_roles%'
            $expirationMonths: '%security_password_expiration_months%'
            $warningDays: '%security_password_expiration_warning_days%'

    App\Security\Password\PasswordChangeService:
        arguments:
            $historySize: '%security_password_history_size%'

    App\Security\Subscriber\LogoutEventSubscriber:
        arguments:
            $urlBo: '%url_bo%'
            $urlFo: '%url_fo%'
            $logoutRedirectionBo: '%logout_redirection_bo%'
            $logoutRedirectionFo: '%logout_redirection_fo%'

    App\Listener\CspNonceInjectorListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 100 }
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -100 }

    App\Service\HistoriqueService:
        calls:
            - [setDemandeService, ['@App\Service\DemandeServiceFO']]

    App\Service\DemandeServiceBO:
        calls:
            - [ setDemandeServiceFO, [ '@App\Service\DemandeServiceFO' ] ]

    App\Service\MailerService:
        arguments:
            $defaultFrom: '%mailer_address_from%'

    App\Service\AdminService:
        arguments:
            $dateReferenceConvert: '%date_reference_convert%'
            $appRootDossierDataSymfony: '%app_root_dossier_data_symfony%'

    App\Service\DocumentAccessChecker:
        arguments:
            $appDateUsNouvelInstructeur: '%app_date_us_nouvel_instructeur%'


    App\Service\DateCPService:
        arguments:
            $dateUsPassageMontantAuditEnergie: '%app_date_us_passage_montant_auditEnergie%'
            $datePassageMontantAuditRegion: '%app_date_passage_montant_auditRegion%'

    App\Service\TitreService:
        arguments:
            $appDateUsNouvelInstructeur: '%app_date_us_nouvel_instructeur%'
            $appAs400FolderIn: '%app_as400_folder_in%'
            $appDatePassageMontantTravauxNiveau3Bbc: '%app_date_passage_montant_travaux_niveau_3_BBC%'
            $appRootDossierDataSymfony: '%app_root_dossier_data_symfony%'
            $projectRoot: '%kernel.project_dir%'


    App\Service\DemandeTravauxDevisService:
        arguments:
            $projectDataPath: '%app_root_dossier_data_symfony%'
            $productionTravauxNiveauBBC2: '%production_travauxNiveau_BBC2%'

    App\Service\CommentaireService:
        arguments:
            $emailRegionPaiement: '%email_region_paiement%'
            $emailRegionInstruction: '%email_region_instruction%'
            $emailPrestataireInstruction: '%email_prestataire_instruction%'
            $mailerAddressFrom: '%mailer_address_from%'

    App\Service\DateRMHService:
        arguments:
            $productionTravauxNiveauBBC1: '%production_travauxNiveau_BBC1%'
            $productionTravauxNiveauBBC2: '%production_travauxNiveau_BBC2%'
            $rmhFilePrefix: '%rmh_file_prefix%'
            $rmhFileNumeroDepartement: '%rmh_file_numero_departement%'
            $rmhFileCodeCollectivite: '%rmh_file_code_collectivite%'
            $rmhFileNumeroTrainVirement: '%rmh_file_numero_train_virement%'
            $rmhFileCodeNature: '%rmh_file_code_nature%'
            $rmhFileCodeMonnaie: '%rmh_file_code_monnaie%'
            $rmhFileLibelleOperation: '%rmh_file_libelle_operation%'
            $appRootDossierDataSymfony: '%app_root_dossier_data_symfony%'

    App\Service\ProductionService:
        arguments:
            $productionTravauxNiveauBBC1: '%production_travauxNiveau_BBC1%'
            $productionTravauxNiveauBBC2: '%production_travauxNiveau_BBC2%'
            $productionTopReeditionValue: '%production_top_reedition_value%'
            $productionDematValue: '%production_demat_value%'
            $appAs400FolderOut: '%app_as400_folder_out%'
            $appRootDossierDataSymfony: '%app_root_dossier_data_symfony%'
            $isProduction: '%is_production%'
            $mailerAddressFrom: '%mailer_address_from%'

    App\Service\AdminFormService: ~

    App\Service\DocumentService:
        arguments:
            $rootUploadDir: '%app_root_dossier_data_symfony%'
            $rmhFilePrefix: '%rmh_file_prefix%'

    App\Command\DeleteDocumentTravauxRemboursementTermineCommand:
        arguments:
            $productionTravauxNiveauBBC1: '%production_travauxNiveau_BBC1%'
            $productionTravauxNiveauBBC2: '%production_travauxNiveau_BBC2%'

    App\Service\RollbackDocumentService:
        arguments:
            $appRootDossierDataSymfony: '%app_root_dossier_data_symfony%'

    App\Command\ListDeletedDocumentTravauxRemboursementTermineCommand:
        arguments:
            $appRootDossierDataSymfony: '%app_root_dossier_data_symfony%'
            $productionTravauxNiveauBBC1: '%production_travauxNiveau_BBC1%'
            $productionTravauxNiveauBBC2: '%production_travauxNiveau_BBC2%'

    App\Command\ExportADEMECommand:
        arguments:
            $mailerAddressFrom: '%mailer_address_from%'
            $appRootDossierDataSymfony: '%app_root_dossier_data_symfony%'

    App\Command\ProcessDeleteDocumentCommand:
        arguments:
            $rootUploadDir: '%app_root_dossier_data_symfony%'
            $productionTravauxNiveauBBC1: '%production_travauxNiveau_BBC1%'
            $productionTravauxNiveauBBC2: '%production_travauxNiveau_BBC2%'

    App\Command\RollbackDeletedDocumentTravauxRemboursementTermineCommand:
        arguments:
            $productionTravauxNiveauBBC1: '%production_travauxNiveau_BBC1%'
            $productionTravauxNiveauBBC2: '%production_travauxNiveau_BBC2%'

    App\Service\APIService:
        arguments:
            $appApiCleaBaseUrl: '%app_api_clea_base_url%'
            $appApiCleaClientId: '%app_api_clea_client_id%'
            $appApiCleaClientSecret: '%app_api_clea_client_secret%'

    App\Service\CarnetInformationLogementService:
        arguments:
            $appApiCleaUserId: '%app_api_clea_user_id%'
            $appApiCleaIsDataProduction: '%app_api_clea_is_data_production%'
            $appRootFolderDataSymfony: '%app_root_dossier_data_symfony%'

    App\Command\CarnetInformationLogementCommand:
        arguments:
            $productionTravauxNiveauBBC2: '%production_travauxNiveau_BBC2%'

    App\Command\ResendCleaEmailCommand:
        arguments:
            $productionTravauxNiveauBBC2: '%production_travauxNiveau_BBC2%'

    App\Command\UpdateFicheTechniqueSurfaceHabitableCommand:
        arguments:
            $loggerUpdateFicheTechnique: '@monolog.logger.command_update_fiche_technique'

    App\Command\ExportDemandeCommand:
        arguments:
            $loggerExportDemande: '@monolog.logger.command_export_demande'

    App\EventListener\ExceptionListener:
#        arguments:
#            $urlFO: '%url_fo%'
#            $urlBO: '%url_bo%'
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }

    App\Security\Listener\ActivityHandlerListener:
        arguments:
            $maxIdleTime: '%session_max_idle_time%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }
