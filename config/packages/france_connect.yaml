france_connect:
  client_id: '%env(FC_CLIENT_ID)%'
  client_secret: '%env(FC_CLIENT_SECRET)%'
  provider_base_url: '%env(FC_PROVIDER_BASE_URL)%'
  callback_type: 'url'
  callback_value: '%env(FC_CALLBACK_VALUE)%'
  logout_type: 'url'
  logout_value: '%env(FC_LOGOUT_VALUE)%'
  result_type: 'url'
  result_value: '%env(FC_RESULT_VALUE)%'
  scopes:
    - 'champ1'
    - 'champ2'
  providers_keys:
    - 'cle1'
    - 'cle2'