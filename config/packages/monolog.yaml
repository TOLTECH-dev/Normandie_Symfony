monolog:
    channels:
        - deprecation
        - main
        - command_delete_documents
        - command_delete_account
        - command_update_fiche_technique
        - command_export_demande

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!command_delete_documents", "!command_delete_account", "!command_update_fiche_technique", "!command_export_demande"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!command_delete_documents", "!command_delete_account", "!command_update_fiche_technique", "!command_export_demande"]
            command_delete_documents:
                type: rotating_file
                path: '%kernel.logs_dir%/command_delete_documents_%kernel.environment%.log'
                level: debug
                max_files: 60
                channels: command_delete_documents
            command_delete_account:
                type: rotating_file
                path: '%kernel.logs_dir%/command_delete_account_%kernel.environment%.log'
                level: debug
                max_files: 60
                channels: command_delete_account
            command_update_fiche_technique:
                type: rotating_file
                path: '%kernel.logs_dir%/command_update_fiche_technique_%kernel.environment%.log'
                level: debug
                max_files: 60
                channels: command_update_fiche_technique
            command_export_demande:
                type: rotating_file
                path: '%kernel.logs_dir%/command_export_demande_%kernel.environment%.log'
                level: debug
                max_files: 60
                channels: command_export_demande

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                formatter: monolog.formatter.json
            # For debugging: always write all log levels to prod.log (bypass fingers_crossed)
            all_stream:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ["!deprecation"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            command_delete_documents:
                type: rotating_file
                path: '%kernel.logs_dir%/command_delete_documents_prod.log'
                level: debug
                max_files: 60
                channels: command_delete_documents
            command_delete_account:
                type: rotating_file
                path: '%kernel.logs_dir%/command_delete_account_prod.log'
                level: debug
                max_files: 60
                channels: command_delete_account
            command_update_fiche_technique:
                type: rotating_file
                path: '%kernel.logs_dir%/command_update_fiche_technique_prod.log'
                level: debug
                max_files: 60
                channels: command_update_fiche_technique
            command_export_demande:
                type: rotating_file
                path: '%kernel.logs_dir%/command_export_demande_prod.log'
                level: debug
                max_files: 60
                channels: command_export_demande
