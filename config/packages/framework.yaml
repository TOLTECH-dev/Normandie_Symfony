# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: 'session.handler.native_file'
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        storage_factory_id: session.storage.factory.native
        # Vulnérabilité 2 / recommandation 6 de l'audit ALMOND : options de sécurité du cookie de session.
        # Elles s'appliquent aussi au cookie « se souvenir de moi », qui en hérite.
        #  - httponly : cookie illisible par JavaScript (vol de session via une XSS) ;
        #  - samesite lax : cookie non transmis par les requêtes d'un autre site (hors navigation GET),
        #    ce qui préserve le retour de FranceConnect et les liens reçus par e-mail (« strict » les casserait) ;
        #  - secure : cookie transmis uniquement en HTTPS. « auto » en local (servi en HTTP), forcé en production.
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
        # Durée de vie : cookie de session du navigateur, supprimé à sa fermeture
        cookie_lifetime: 0

    # Adresses des proxys placés devant l'application (cf. TRUSTED_PROXIES dans .env) : elles
    # déterminent l'adresse cliente retenue derrière un répartiteur de charge, dont dépendent le
    # filtrage réseau (Reco-18) et les compteurs anti-bruteforce (VUL03).
    #
    # La liste est vide, et doit le rester : en production, Apache rétablit lui-même l'adresse du
    # visiteur via mod_remoteip (réponse DRI du 11/10/2026), si bien que REMOTE_ADDR porte déjà
    # l'adresse réelle et qu'aucun en-tête X-Forwarded-* n'a besoin d'être cru. Une liste non vide
    # — « REMOTE_ADDR » en particulier — rendrait au contraire ces en-têtes dignes de foi pour un
    # client qui joindrait le serveur sans intermédiaire.
    #
    # Les en-têtes ci-dessous ne sont donc jamais pris en compte en l'état ; ils restent déclarés
    # pour que la configuration reste juste si un proxy identifiable est un jour placé devant.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers:
        - x-forwarded-for
        - x-forwarded-host
        - x-forwarded-proto
        - x-forwarded-port

    #esi: true
    #fragments: true
    php_errors:
        log: true

    cache:
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

when@prod:
    framework:
        session:
            # Recette et production sont servies uniquement en HTTPS : « Secure » est imposé plutôt que
            # déduit de la requête, pour ne pas dépendre de l'en-tête X-Forwarded-Proto du proxy.
            cookie_secure: true

when@dev:
    framework:
        cache:
            app: cache.adapter.filesystem

when@test:
    framework:
        test: true
        # La suite de tests ne doit pas dépendre d'une instance Redis : les compteurs
        # du RateLimiter, qui vivent dans le pool applicatif, sont stockés sur disque.
        cache:
            app: cache.adapter.filesystem
        session:
            storage_factory_id: session.storage.factory.mock_file
