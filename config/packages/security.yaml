security:
    enable_authenticator_manager: true

    # Reco-16 du plan de traitement des risques : protection des mots de passe par Argon2id,
    # validée par la Région. Argon2id consomme de la mémoire en plus du temps de calcul, ce qui
    # rend le cassage par cartes graphiques nettement plus coûteux que bcrypt.
    #
    # « migrate_from: auto » conserve la vérification des empreintes bcrypt existantes : un compte
    # qui se connecte est authentifié par son ancienne empreinte, puis celle-ci est immédiatement
    # réécrite en Argon2id par UserRepository::upgradePassword, sans que l'utilisateur s'en aperçoive.
    #
    # Les empreintes héritées de l'ancienne application (SHA-512 + sel, 88 caractères) ne sont
    # DÉLIBÉRÉMENT pas vérifiables : PHP ne reconnaît pas ce format, et rétablir un vérificateur
    # reviendrait à réintroduire l'algorithme que la Reco-16 demande d'abandonner. Ces empreintes
    # sont neutralisées au déploiement (sql/reco16_invalidation_empreintes_anciennes.sql) ; les
    # comptes concernés reprennent la main par « mot de passe oublié ».
    #
    # Les paramètres sont portés par l'environnement : ils se calibrent sur la machine qui exécute
    # le calcul, sans livraison de code (cf. SECURITY_ARGON2ID_* dans .env).
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            memory_cost: '%env(int:SECURITY_ARGON2ID_MEMORY_COST)%'
            time_cost: '%env(int:SECURITY_ARGON2ID_TIME_COST)%'
            migrate_from:
                - auto

    # Regroupements fonctionnels (vulnérabilité 6 / recommandation 10 de l audit ALMOND).
    # Un écran ne cite plus la liste des profils autorisés, mais le regroupement correspondant.
    # Les droits effectifs sont identiques à ceux d avant l introduction de ces regroupements :
    # faire évoluer un droit consiste désormais à ajouter ou retirer un regroupement ci-dessous.
    #
    #   ROLE_APP_UTILISATEUR          tout compte connecté, back-office comme espace bénéficiaire
    #   ROLE_BO_GESTION_REGION        gestion des référentiels et du suivi par la Région
    #   ROLE_BO_ESPACE_CONSEILLER     écrans de saisie des conseillers
    #   ROLE_BO_INSTRUCTION           instruction des demandes
    #   ROLE_BO_INSTRUCTION_ETENDUE   instruction, remboursements compris
    #   ROLE_BO_DOSSIER_CONSULTATION  consultation des dossiers (liste, fiche, historique)
    role_hierarchy:
        ROLE_USER:           ROLE_USER
        ROLE_MEMBER:         [ROLE_MEMBER, ROLE_APP_UTILISATEUR]
        ROLE_CONSEILLER:     [ROLE_CONSEILLER, ROLE_APP_UTILISATEUR, ROLE_BO_DOSSIER_CONSULTATION, ROLE_BO_ESPACE_CONSEILLER]
        ROLE_INSTRUCTEUR:    [ROLE_INSTRUCTEUR, ROLE_APP_UTILISATEUR, ROLE_BO_DOSSIER_CONSULTATION, ROLE_BO_INSTRUCTION, ROLE_BO_INSTRUCTION_ETENDUE]
        ROLE_INSTRUCTEUR_UP: [ROLE_INSTRUCTEUR_UP, ROLE_APP_UTILISATEUR, ROLE_BO_INSTRUCTION_ETENDUE]
        ROLE_AUDITEUR:       [ROLE_AUDITEUR, ROLE_APP_UTILISATEUR, ROLE_BO_DOSSIER_CONSULTATION]
        ROLE_RENOVATEUR:     [ROLE_RENOVATEUR, ROLE_APP_UTILISATEUR, ROLE_BO_DOSSIER_CONSULTATION]
        ROLE_EPCI:           [ROLE_EPCI, ROLE_APP_UTILISATEUR, ROLE_BO_DOSSIER_CONSULTATION]
        ROLE_CLIENT:         [ROLE_CLIENT, ROLE_APP_UTILISATEUR, ROLE_BO_DOSSIER_CONSULTATION, ROLE_BO_GESTION_REGION, ROLE_BO_INSTRUCTION, ROLE_BO_INSTRUCTION_ETENDUE]
        ROLE_ADMIN:          [ROLE_CLIENT, ROLE_INSTRUCTEUR, ROLE_INSTRUCTEUR_UP, ROLE_ALLOWED_TO_SWITCH, ROLE_BO_ESPACE_CONSEILLER]
        ROLE_SUPER_ADMIN:    [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]
        ROLE_AUTOMATE:       [ROLE_AUTOMATE, ROLE_APP_UTILISATEUR]
        ROLE_TECHNIQUE:      [ROLE_TECHNIQUE, ROLE_APP_UTILISATEUR, ROLE_BO_DOSSIER_CONSULTATION]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        backoffice:
            pattern: ^/admin
            context: primary_auth
            user_checker: App\Security\UserChecker
            provider: app_user_provider
            lazy: true

            # Anti-bruteforce (V3 / R7 de l'audit ALMOND) : les seuils et les fenêtres
            # sont portés par les limiteurs de config/packages/rate_limiter.yaml.
            login_throttling:
                limiter: App\Security\RateLimiter\LoginRateLimiter

            form_login:
                enable_csrf: true
                login_path: admin_user_login
                check_path: admin_user_login
                default_target_path: /694F83AC9EB8CB8387728215CF5C99972A0AF791A633A586DDB0586ECD5DE5B1C9546D5FB8BBEBB097606C1A09FADFC4152BE2BCB62ACA1BB25A4B850FE07E0C
                success_handler: App\Security\Handler\BackOfficeLoginSuccessHandler

            # Authentification multi-facteur des profils Administrateur, Instructeur et
            # Client (audit ALMOND) : code envoyé par courriel après validation du mot de
            # passe. Profils concernés : paramètre "security_mfa_roles" (services.yaml).
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                enable_csrf: true
                # Rappelé avec le jeton définitif une fois le code validé.
                success_handler: App\Security\Handler\BackOfficeLoginSuccessHandler
                failure_handler: App\Security\TwoFactor\TwoFactorFailureHandler

            # Déconnexion : la session est invalidée côté serveur et le cookie de session supprimé
            # côté navigateur (vulnérabilité 2 / recommandation 6 de l'audit ALMOND).
            # Pas de « Se souvenir de moi » : ce cookie, vérifié par signature et non conservé côté
            # serveur, restait valable après la déconnexion et reconnectait sans second facteur.
            logout:
                path: admin_user_logout
                target: "%logout_redirection_bo%"

        main:
            pattern: ^/
            context: primary_auth
            user_checker: App\Security\UserChecker
            provider: app_user_provider
            lazy: true

            # Anti-bruteforce (V3 / R7 de l'audit ALMOND) : les seuils et les fenêtres
            # sont portés par les limiteurs de config/packages/rate_limiter.yaml.
            login_throttling:
                limiter: App\Security\RateLimiter\LoginRateLimiter

            # Pas de second facteur sur ce firewall : les profils soumis au MFA y sont
            # refusés (App\Security\Subscriber\MainFirewallMfaGuardSubscriber).
            form_login:
                enable_csrf: true
                login_path: user_login
                check_path: user_login
                default_target_path: /8B6717D4A69717640022F88307D828D95CE99BCE944F418E58445D1C65CD5FE00F5CB774D8F26FD7C56DD95942B3E29463F880BE78514FC8DFD78807D3B20DBC
                success_handler: App\Security\Handler\MainLoginSuccessHandler

            # Même règle que le back-office : pas de « Se souvenir de moi » (cookie valable 48 h,
            # y compris après la déconnexion).
            logout:
                path: user_logout
                target: "%logout_redirection_fo%"

    access_control:
        # back-office
        - { path: ^/admin/bo_login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        # Saisie du code MFA : réservée à l'utilisateur dont le mot de passe vient d'être validé.
        - { path: ^/admin/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: [ ROLE_CONSEILLER, ROLE_INSTRUCTEUR, ROLE_INSTRUCTEUR_UP, ROLE_AUDITEUR, ROLE_RENOVATEUR, ROLE_EPCI, ROLE_CLIENT, ROLE_AUTOMATE, ROLE_TECHNIQUE ] }
        - { path: ^/member, roles: ROLE_MEMBER }
        # front-office
        - { path: ^/, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/registration, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/resetting, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        #- { path: ^/connexion, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        #- { path: ^/inscription, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        #- { path: ^/mot-de-passe-oublie, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/profile, role: IS_AUTHENTICATED_FULLY }
        - { path: ^/deconnexion$, role: IS_AUTHENTICATED_FULLY }
        #- { path: ^/login$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        #- { path: ^/register, role: IS_AUTHENTICATED_ANONYMOUSLY }
        #- { path: ^/resetting, role: IS_AUTHENTICATED_ANONYMOUSLY }
        #- { path: ^/admin/, role: ROLE_ADMIN }


when@test:
    security:
        password_hashers:
            # Même algorithme qu'en production — les tests doivent éprouver ce qui sera livré —
            # mais au coût le plus faible possible : calibrer sur les tests gâcherait du temps
            # de calcul sans rien démontrer de plus.
            #
            # Les minima sont ceux de Sodium, que Symfony retient pour « argon2id » dès que
            # l'extension est chargée : 3 passes et 10 240 Kio. Les descendre fait échouer la
            # construction du hacheur, et non le calcul (« $opsLimit must be 3 or greater »).
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3        # minimum admis par Sodium
                memory_cost: 10240  # minimum admis par Sodium, en Kio
                migrate_from:
                    - auto
