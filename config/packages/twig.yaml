twig:
    default_path: '%kernel.project_dir%/templates'

    globals:
        date_reference_convert: '%env(DATE_REFERENCE_CONVERT)%'
        fc_js_url: '%env(FC_JS_URL)%'
        app_is_https: '%env(bool:APP_IS_HTTPS)%'
        prefix_pathname_bundle_fo: 'fo'
        prefix_pathname_bundle_bo: 'bo'
        # Reco-16 : bandeau d'accompagnement de la bascule vers Argon2id, affiché sur les pages de
        # connexion. Porté par l'environnement pour pouvoir être retiré sans livraison de code,
        # une fois la vague de réinitialisations passée.
        bandeau_mots_de_passe: '%env(bool:SECURITY_PASSWORD_NOTICE_ENABLED)%'

when@test:
    twig:
        strict_variables: true
