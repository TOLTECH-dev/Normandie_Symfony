parameters:
    # reCAPTCHA actif en dev : les cles de .env.dev.local sont les cles de test
    # publiques de Google, valides sur n'importe quel domaine.
    captcha_enabled: true

services:
    App\EventListener\ExceptionListener:
        autowire: true
        autoconfigure: false

    # Reco-04 : en developpement, OBSERVATION SEULE.
    #
    # La barre de debogage Symfony vit d inline : une politique appliquee la
    # briserait, ce pour quoi la CSP etait jusqu ici purement desactivee en
    # dev. En ne posant que l en-tete Report-Only, les violations
    # apparaissent dans la console du navigateur sans rien bloquer.
    App\Security\Csp\CspListener:
        arguments:
            $politique: null
            $politiqueObservee: '@csp.politique_stricte'
            $active: '%csp_enabled%'
            $uriDeRapport: '%csp_report_uri%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 100 }
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -100 }
